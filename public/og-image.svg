<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d14"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="900" cy="100" r="300" fill="#e94560" opacity="0.05"/>
  <circle cx="1100" cy="500" r="200" fill="#f5a623" opacity="0.04"/>
  <!-- Logo area -->
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="80" font-weight="700" fill="#e94560">NihongoQuest</text>
  <text x="80" y="290" font-family="system-ui, sans-serif" font-size="60" font-weight="400" fill="#f7f5f0" opacity="0.9">日本語クエスト</text>
  <!-- Tagline -->
  <text x="80" y="400" font-family="system-ui, sans-serif" font-size="36" font-weight="400" fill="#a09880">Master Japanese vocabulary</text>
  <text x="80" y="450" font-family="system-ui, sans-serif" font-size="36" font-weight="400" fill="#a09880">with smart flashcards &amp; AI explanations.</text>
  <!-- Feature badges -->
  <rect x="80" y="510" width="180" height="50" rx="25" fill="#e94560" opacity="0.15"/>
  <text x="170" y="542" font-family="system-ui, sans-serif" font-size="20" fill="#e94560" text-anchor="middle">JLPT N5-N1</text>
  <rect x="280" y="510" width="160" height="50" rx="25" fill="#f5a623" opacity="0.15"/>
  <text x="360" y="542" font-family="system-ui, sans-serif" font-size="20" fill="#f5a623" text-anchor="middle">AI Powered</text>
  <rect x="460" y="510" width="180" height="50" rx="25" fill="#4ade80" opacity="0.15"/>
  <text x="550" y="542" font-family="system-ui, sans-serif" font-size="20" fill="#4ade80" text-anchor="middle">Offline Ready</text>
</svg>
