name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Berjalan otomatis setiap hari Senin pukul 06:00 WIB (Minggu 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

# Cancel in-progress runs when a new commit is pushed (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Job 2: TypeScript ────────────────────────────────────────────────────────
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

  # ── Job 3: Tests ─────────────────────────────────────────────────────────────
  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # ── Job 4: Build ─────────────────────────────────────────────────────────────
  # Uses dummy env vars — CI does NOT connect to real Supabase or AI services.
  # Build verifies TypeScript compilation + Next.js page generation is error-free.
  # Real secrets (SENTRY_AUTH_TOKEN) are stored in GitHub Secrets.
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      DATABASE_URL: postgresql://placeholder:placeholder@placeholder:5432/postgres
      GEMINI_API_KEY: placeholder-gemini-key
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://nihongoquest.vercel.app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  # ── Job 5: Production Health & Live DB Check ───────────────────────────────
  health-check:
    name: Live Production Health
    runs-on: ubuntu-latest
    steps:
      - name: Ping NihongoQuest Production API
        run: |
          echo "Pinging production health check..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://nihongoquest-ashen.vercel.app/api/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Production API returned status $HTTP_CODE"
            exit 1
          fi
          if ! echo "$BODY" | grep -q '"db":"connected"'; then
            echo "❌ Database is not reported as connected!"
            exit 1
          fi
          echo "✅ Production is alive and Supabase DB is connected!"
